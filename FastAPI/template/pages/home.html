<section class="home">
    <h1>Home Page</h1>
    <h3>Existing Users</h3>
    <div id="user-list"></div>

    <!-- Login Form -->
    <form id="login-form">
        <input type="text" id="login-username" placeholder="Enter username to login" required />
        <button type="submit">Log In</button>
    </form>
    <div id="login-message"></div>

    <!-- Signup Form -->
    <form id="signup-form">
        <input type="text" id="signup-username" placeholder="Enter username to signup" required />
        <button type="submit">Sign Up</button>
    </form>
    <div id="signup-message"></div>

    <!-- Delete Form -->
    <form id="delete-form">
        <input type="text" id="delete-username" placeholder="Enter username to delete" required />
        <button type="submit">Delete User</button>
    </form>
    <div id="delete-message"></div>
</section>
